[relay]
id = "relay-a"
server_addr = "relay.example.com:7443"
heartbeat_interval_ms = 1000
data_timeout_ms = 3000

[[relay.links]]
id = "serial-radio-1"
type = "serial"
path = "COM4"
baud_rate = 115200

[[relay.links]]
id = "udp-unicast-1"
type = "udp_unicast"
bind_addr = "0.0.0.0:9001"
tx_target = "192.168.10.20:9002"
allowed_source = "192.168.10.20:9002"

[[relay.links]]
id = "udp-multicast-1"
type = "udp_multicast"
bind_addr = "0.0.0.0:10001"
group_addr = "239.10.10.10"
interface_addr = "192.168.20.10"
tx_target = "239.10.10.10:10001"
multicast_ttl = 1
multicast_loop = false

# 可选伺服转台固定 UDP 点播发送配置（单向发送，从服务端控制流提取 32 字节 EB90 帧传出）
# [relay.turntable]
# bind_addr = "0.0.0.0:0"
# target_addr = "192.168.1.50:9003"

[server]
id = "server-a"
listen_addr = "0.0.0.0:7443"
ground_station_listen_addr = "127.0.0.1:7500"
heartbeat_timeout_ms = 3000
data_timeout_ms = 3000
ground_station_heartbeat_interval_ms = 1000

# Optional managed RTSP-to-RTMP video profile. The two paths must match.
# [relay.video]
# source_url = "rtsp://camera.example/live"
# publish_url = "rtmp://video-server.example:1935/uav/relay-a"
