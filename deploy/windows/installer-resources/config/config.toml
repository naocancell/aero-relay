[relay]
id = "__RELAY_ID__"
server_addr = "relay.example.com:7443"
heartbeat_interval_ms = 1000
data_timeout_ms = 3000

[[relay.links]]
id = "s1"
type = "serial"
path = "COM4"
baud_rate = 115200

[server]
id = "server-a"
listen_addr = "0.0.0.0:7443"
ground_station_listen_addr = "127.0.0.1:7500"
heartbeat_timeout_ms = 3000
data_timeout_ms = 3000
ground_station_heartbeat_interval_ms = 1000

