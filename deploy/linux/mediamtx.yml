# MediaMTX version is pinned in deploy/windows/mediamtx-version.txt.
# relay-linkd owns this MediaMTX process. Keep the control API local: the
# backend uses it only to determine whether the configured RTMP path is ready.
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: 127.0.0.1:9997
apiEncryption: false

# The relay publishes RTMP here. Operators can read the same path as RTSP.
rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :554

rtmp: true
rtmpEncryption: "no"
rtmpAddress: :1935

# Browser/HLS/SRT endpoints are intentionally not exposed by the first managed
# profile. Add them only after their network and authentication policy exists.
hls: false
webrtc: false
srt: false

readTimeout: 2s

pathDefaults:
  source: publisher
  # Server coordinates video ownership, allow swift replacement of stale publisher sockets.
  overridePublisher: true
  record: false

# A path must be declared explicitly (or through all_others) before an RTMP
# publisher can create it. The server's configured stream_path is variable, so
# keep the managed publisher entry open for that path.
paths:
  all_others:
    source: publisher
    overridePublisher: true
